services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: eduforge
      POSTGRES_USER: eduforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
